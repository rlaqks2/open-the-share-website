name: 1-Hour Auto Sync Blog Posts & Deploy

on:
  schedule:
    # 매 1시간마다 실행 (UTC 기준 매 시간 0분)
    - cron: '0 * * * *'
  # GitHub 웹 브라우저에서 언제든 'Run workflow' 버튼으로 즉시 수동 실행도 가능
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          # pillow: 블로그 썸네일 리사이즈/압축용 (sync_blog.py)
          pip install pillow

      - name: Run Blog Post Sync Script
        run: |
          python scripts/sync_blog.py

      - name: Check for updates
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "New blog posts detected! Proceeding with commit and deployment."
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No new blog posts. Skipping build and deploy."
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/images/portfolio/ src/data/mockData.ts
          git commit -m "chore(auto-sync): update portfolio with new blog posts [skip ci]"
          # 사람이 그 사이 push 한 커밋이 있어도 실패하지 않도록 rebase 후 push
          git pull --rebase origin master
          git push origin master

      - name: Setup Node.js
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        if: steps.check_changes.outputs.has_changes == 'true'
        run: npm ci

      - name: Build project
        if: steps.check_changes.outputs.has_changes == 'true'
        run: npm run build
        env:
          VITE_GOOGLE_SHEET_WEBHOOK_URL: ${{ vars.VITE_GOOGLE_SHEET_WEBHOOK_URL }}

      - name: Deploy to GitHub Pages (gh-pages)
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: openthe.kr
